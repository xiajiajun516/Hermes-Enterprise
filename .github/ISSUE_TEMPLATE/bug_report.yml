name: Bug Report
description: Create a report to help us improve the Hermes Enterprise Profile
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the issue is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or agent interactions leading to the issue.
    validations:
      required: true
