name: Validate Artifacts
on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Artifact Schemas
        run: |
          python scripts/validate_artifact.py artifacts/spec.md
          python scripts/validate_artifact.py artifacts/architecture.md
          python scripts/validate_artifact.py artifacts/compliance-report.md
      - name: Validate Kanban
        run: python scripts/validate_kanban.py kanban/kanban.md
      - name: Self Health Check
        run: python scripts/self_health_check.py
