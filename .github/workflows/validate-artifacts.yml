name: Validate Forward Artifacts
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Unit and fixture checks
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Bootstrap state is explicitly non-passing until first tracked run
        run: |
          python scripts/self_health_check.py && exit 1 || test $? -eq 1
      - name: Validate Kanban
        run: python scripts/validate_kanban.py kanban/kanban.md
