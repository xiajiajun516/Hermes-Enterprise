[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Tests insert scripts/ on sys.path before importing — intentional pattern.
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["if __name__ == \"__main__\":", "pragma: no cover"]
